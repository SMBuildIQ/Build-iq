<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildIQ Mobile Screenshots</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #F3EEE6; color: #3D2A1D; }
    header { background: #161412; color: #FFFDF9; padding: 28px 20px; border-bottom: 3px solid #FF8833; }
    header p { color: #FF8833; margin: 0 0 8px; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    header h1 { margin: 0; font-size: 32px; letter-spacing: 0.04em; text-transform: uppercase; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 28px; }
    figure { margin: 0; background: #FFFDF9; border: 1px solid rgba(93,65,45,0.18); }
    figcaption { padding: 12px 14px; border-bottom: 1px solid rgba(93,65,45,0.12); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; }
    img { display: block; width: 100%; height: auto; background: #221E1B; }
    a.raw { display: inline-block; padding: 8px 14px; color: #FF8833; }
  </style>
</head>
<body>
  <header>
    <p>Supply Monkey · Millwork Studio</p>
    <h1>Mobile screenshots</h1>
  </header>
  <main>
    <figure><figcaption>Login</figcaption><img src="./01-login.png" alt="Login" /></figure>
    <figure><figcaption>Jobs</figcaption><img src="./02-jobs.png" alt="Jobs" /></figure>
    <figure><figcaption>Job detail</figcaption><img src="./08-job-detail.png" alt="Job detail" /></figure>
    <figure><figcaption>Proposals</figcaption><img src="./03-proposals.png" alt="Proposals" /></figure>
    <figure><figcaption>Shop</figcaption><img src="./04-shop.png" alt="Shop" /></figure>
    <figure><figcaption>Cart</figcaption><img src="./05-cart.png" alt="Cart" /></figure>
    <figure><figcaption>Track</figcaption><img src="./07-track.png" alt="Track" /></figure>
    <figure><figcaption>Account / More</figcaption><img src="./06-more.png" alt="More" /></figure>
    <figure><figcaption>Jobs · tablet</figcaption><img src="./09-jobs-tablet.png" alt="Jobs tablet" /></figure>
  </main>
</body>
</html>
