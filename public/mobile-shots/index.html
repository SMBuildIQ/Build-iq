<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildIQ Mobile Screenshots · Updated</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #F3EEE6; color: #3D2A1D; }
    header { background: #161412; color: #FFFDF9; padding: 28px 20px; border-bottom: 3px solid #FF8833; }
    header p { color: #FF8833; margin: 0 0 8px; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    header h1 { margin: 0; font-size: 32px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
    header h1 .iq { color: #FF8833; }
    header .note { margin: 12px 0 0; color: rgba(255,253,249,0.65); font-size: 14px; max-width: 48ch; line-height: 1.45; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 28px; }
    figure { margin: 0; background: #FFFDF9; border: 1px solid rgba(93,65,45,0.18); }
    figcaption { padding: 12px 14px; border-bottom: 1px solid rgba(93,65,45,0.12); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; }
    img { display: block; width: 100%; height: auto; background: #221E1B; }
  </style>
</head>
<body>
  <header>
    <p>Supply Monkey · Millwork Studio</p>
    <h1>Build<span class="iq">IQ</span> screenshots</h1>
    <p class="note">Updated — per-project materials library (lumber through stone), drawings upload, orange IQ wordmark.</p>
  </header>
  <main>
    <figure><figcaption>Login · Create account</figcaption><img src="./01-login.png?v=8" alt="Login" /></figure>

    <figure><figcaption>Jobs</figcaption><img src="./02-jobs.png?v=8" alt="Jobs" /></figure>
    <figure><figcaption>Job detail</figcaption><img src="./08-job-detail.png?v=8" alt="Job detail" /></figure>
    <figure><figcaption>Drawings upload</figcaption><img src="./08b-drawings.png?v=8" alt="Drawings upload" /></figure>
    <figure><figcaption>Materials library</figcaption><img src="./08c-materials-library.png?v=8" alt="Materials library" /></figure>
    <figure><figcaption>Proposals</figcaption><img src="./03-proposals.png?v=8" alt="Proposals" /></figure>
    <figure><figcaption>Shop</figcaption><img src="./04-shop.png?v=8" alt="Shop" /></figure>
    <figure><figcaption>Cart · empty</figcaption><img src="./05-cart.png?v=8" alt="Cart empty" /></figure>
    <figure><figcaption>Cart · with items</figcaption><img src="./05b-cart-items.png?v=8" alt="Cart with items" /></figure>
    <figure><figcaption>Track</figcaption><img src="./07-track.png?v=8" alt="Track" /></figure>
    <figure><figcaption>Account / More</figcaption><img src="./06-more.png?v=8" alt="More" /></figure>
    <figure><figcaption>Jobs · tablet</figcaption><img src="./09-jobs-tablet.png?v=8" alt="Jobs tablet" /></figure>
