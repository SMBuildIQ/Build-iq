# Local infra for apps/api (PostgreSQL · Redis · MinIO)
# Usage: docker compose -f docker-compose.platform.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildiq
      POSTGRES_PASSWORD: buildiq
      POSTGRES_DB: buildiq
    ports:
      - "5432:5432"
    volumes:
      - buildiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - buildiq_minio:/data

volumes:
  buildiq_pg:
  buildiq_minio:
