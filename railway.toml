# Soft-launch Next.js web on Railway (NOT the Expo mobile app).
# Mobile native builds use Expo EAS — see apps/mobile/eas.json

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
