name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-build-secret-at-least-32-characters-long
      AI_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: e2e-test-secret-at-least-32-characters-long
      AI_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (brief §39 — critical workflows)
        run: npm run pretest:e2e && npm run test:e2e
