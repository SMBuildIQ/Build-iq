services:
  buildiq:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-buildiq-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
    volumes:
      - buildiq-data:/app/data
      - buildiq-uploads:/app/uploads
    restart: unless-stopped

volumes:
  buildiq-data:
  buildiq-uploads:
