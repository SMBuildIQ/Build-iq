services:
  fieldline:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-fieldline-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
    volumes:
      - fieldline-data:/app/data
      - fieldline-uploads:/app/uploads
    restart: unless-stopped

volumes:
  fieldline-data:
  fieldline-uploads:
